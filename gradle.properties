# THE VERSION, AND IT IS THE ONLY PLACE IT IS WRITTEN.
#
# versioning.md: one whole number, no dots, and the number must agree in three places. Here it
# is written once and the other three are DERIVED: build.gradle.kts turns it into versionCode
# and versionName, and the workflow reads this same line for the file name and the release tag.
# A convention that depends on somebody typing it correctly survives until the first tired
# evening, so nothing here is typed twice.
appVersion=1

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
